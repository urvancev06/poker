[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poker"
version = "0.1.0"
description = "Single-user 6-max NLHE poker trainer: engine, equity math, bot archetypes and coaching API."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Alexander Urvancev" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "pokerkit==0.7.6",  # game-state machine + hand evaluation (do not hand-roll); pinned:
                        # the engine relies on its internals (deck replacement, burn
                        # order) and the frozen v1 fingerprint was taken on it
    "treys",      # fast pure-Python evaluator for Monte Carlo equity
    "fastapi",    # the API the frontend talks to
    "uvicorn",    # ASGI server (plain build; uvloop/httptools extras skipped for 3.14 wheel safety)
    "sqlalchemy", # SQLite-backed hand history + my stats
    "numpy>=2.0", # the vector evaluator, exact equity and the precomputed tables
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",  # FastAPI TestClient for API tests
]

[tool.setuptools.packages.find]
# Flat layout: ship only the `poker` package; tests/ and scripts/ stay out of the install.
include = ["poker*"]

[tool.setuptools.package-data]
# The precomputed rank table and preflop equity table (poker/math/data).
poker = ["math/data/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put backend/ on sys.path so tests can import the (uninstalled) scripts/ helpers.
pythonpath = ["."]
# Long oracle checks (for example the flop vector against treys over every combo)
# are opt-in: run them with `-m slow`.
markers = ["slow: long oracle checks, run with -m slow"]
addopts = "-m 'not slow'"
# Silence PokerKit's advisory hints (suboptimal fold, deal recommendation) that
# our controlled engine/sim use intentionally triggers.
filterwarnings = [
    "ignore:There is no reason for this player to fold",
    "ignore:A card being dealt",
]
